{% extends "boutique/base.html" %}
{% block title %}Supprimer – Drive Market{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmer la suppression</h5>
      </div>
      <div class="card-body text-center">
        <p class="mb-3">Voulez-vous vraiment supprimer :</p>
        <p class="fs-5 fw-bold">{{ objet }}</p>
        <p class="text-danger small">Cette action est irréversible.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">
            <i class="bi bi-trash"></i> Oui, supprimer
          </button>
          <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
